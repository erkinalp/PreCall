[workspace]
resolver = "2"
members = [
    "crates/precall-proto",
    "crates/precall-store",
    "crates/precall-broker",
    "crates/precall-api",
    "crates/precall-client",
    "crates/precall-mock",
]

[workspace.package]
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/erkinalp/PreCall"
version = "0.1.0"

[workspace.dependencies]
precall-proto = { path = "crates/precall-proto" }
precall-store = { path = "crates/precall-store" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tokio-rustls = "0.26.5"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2.2.0"
webpki-roots = "1.0"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bytes = "1.12.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
sha2 = "0.11.0"
aes-gcm = "0.10.3"
hkdf = "0.12.4"
rand = "0.9.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
tempfile = "3.27.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
base64 = "0.23.1"
futures-util = { version = "0.3.34", features = ["sink"] }
futures = "0.3.34"
windows = "0.62.2"

[profile.release]
lto = "thin"
codegen-units = 1
